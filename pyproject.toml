[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  "asset_pipeline/workbench",
  "frame_interpolation_service/models",
  "sam3_service/models",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These imports intentionally happen after repository path/bootstrap setup.
"asset_pipeline/pipeline_tool.py" = ["E402"]
"asset_pipeline/services/runner_service.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
